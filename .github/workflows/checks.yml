name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check.py
      - run: python scripts/package-release.py --output-dir dist
